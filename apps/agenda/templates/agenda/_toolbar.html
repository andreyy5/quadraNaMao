<div class="mb-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
  <div class="flex min-w-0 items-center gap-1">
    <a class="btn-icon" data-agenda-previous href="{{ previous_url }}" aria-label="Anterior" title="Anterior (←)">{% include "components/icon.html" with name="left" %}</a>
    <a class="btn-icon" data-agenda-next href="{{ next_url }}" aria-label="Próximo" title="Próximo (→)">{% include "components/icon.html" with name="right" %}</a>
    <div class="relative ml-1 min-w-0" x-data="datePicker">
      <h1 class="text-xl md:text-2xl">
        <button type="button" class="-my-1.5 rounded-lg py-1.5 text-left transition-colors first-letter:uppercase hover:text-primary" @click="open" title="Escolher uma data"><span class="sm:hidden">{{ heading_short|default:heading }}</span><span class="hidden sm:inline">{{ heading }}</span></button>
      </h1>
      <input class="sr-only" type="date" x-ref="date" tabindex="-1" aria-label="Ir para a data" value="{{ day|date:'Y-m-d' }}" data-url="{{ today_url }}" @change="go">
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <a class="btn-secondary" data-agenda-today href="{{ today_url }}" title="Ir para hoje (T)">Hoje</a>
    <div class="flex rounded-xl border border-border p-0.5" role="group" aria-label="Visualização">
      <a class="tab min-h-9 {% if agenda_mode == 'day' %}is-active{% endif %}" href="{% url 'agenda:day' %}?data={{ day|date:'Y-m-d' }}">Dia</a>
      <a class="tab min-h-9 {% if agenda_mode == 'week' %}is-active{% endif %}" href="{% url 'agenda:week' %}?data={{ day|date:'Y-m-d' }}{% if selected %}&espaco={{ selected.pk }}{% endif %}">Semana</a>
    </div>
    <button class="btn-secondary w-11 px-0 sm:w-auto sm:px-4" type="button" data-new-bloqueio aria-label="Bloquear" title="Bloquear horário (B)" hx-get="{% url 'agenda:bloqueio_create' %}?data={{ day|date:'Y-m-d' }}" hx-target="#modal-body">{% include "components/icon.html" with name="lock" %} <span class="hidden sm:inline">Bloquear</span></button>
  </div>
</div>
