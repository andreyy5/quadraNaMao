{% if starts %}
<div class="grid grid-cols-4 gap-1.5 sm:grid-cols-5">
  {% for start in starts %}
  <button type="button" class="time-chip" :class="{ 'is-selected': hora === '{{ start|time:'H:i' }}' }" @click="hora = '{{ start|time:'H:i' }}'; document.getElementById('campo-espaco').value = '{{ espaco.pk }}'; document.getElementById('campo-data').value = '{{ day|date:'Y-m-d' }}'">{{ start|time:"H:i" }}</button>
  {% endfor %}
</div>
{% else %}
<p class="rounded-xl border border-dashed border-border px-3.5 py-4 text-center text-sm text-muted">Nenhum horário livre neste dia. Experimente outro dia ou espaço.</p>
{% endif %}
