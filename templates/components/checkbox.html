<div>
  <label class="switch flex min-h-11 cursor-pointer items-center gap-3 text-sm">{{ field }} <span>{{ field.label }}</span></label>
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
