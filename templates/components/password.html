<div x-data="{ show: false }">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="relative [&_.input]:pr-11" x-effect="$el.querySelector('input').type = show ? 'text' : 'password'">
    {{ field }}
    <button type="button" class="btn-icon absolute right-0 top-0" @click="show = !show" :aria-label="show ? 'Esconder senha' : 'Mostrar senha'" aria-label="Mostrar senha">
      <span x-show="!show">{% include "components/icon.html" with name="eye" %}</span>
      <span x-show="show" x-cloak>{% include "components/icon.html" with name="eye-off" %}</span>
    </button>
  </div>
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
