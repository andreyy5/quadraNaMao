{% load static %}<!doctype html>
<html lang="pt-BR" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080f">
  <title>{% block title %}{{ PRODUCT_NAME }}{% endblock %}</title>
  <script>try { var d = document.documentElement, m = localStorage.getItem("qnm-mode"), s = localStorage.getItem("qnm-sidebar"); if (m) d.dataset.mode = m; d.dataset.sidebar = s || (innerWidth < 1280 ? "collapsed" : "expanded"); } catch (e) {}</script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'js/app.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
